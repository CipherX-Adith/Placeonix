<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="pNavyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#050E1C"/>
    </linearGradient>
    <linearGradient id="greenArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cyanLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- === P-ARROW LOGO ICON MARK === -->
  <g transform="translate(6, 6)">
    <!-- Lower stem shadow / dark navy ribbon base -->
    <path d="M12 42C12 58 22 72 34 72H40C38 60 38 50 48 42H24C17 42 12 42 12 42Z" fill="url(#pNavyGrad)"/>
    
    <!-- Left vertical stem and upper loop in electric blue -->
    <path d="M12 14C12 6 18 0 25 0H64C77 0 86 10 86 24C86 38 77 48 64 48H44C30 48 20 58 19 72H12C12 72 12 24 12 14Z" fill="url(#pBlueGrad)"/>
    
    <!-- White sharp upward growth arrow piercing right through the P -->
    <path d="M24 50L54 20H46L64 12L68 30L60 22L30 52Z" fill="#FFFFFF"/>
  </g>

  <!-- === WORDMARK "Placeonix" === -->
  <g transform="translate(108, 52)">
    <!-- "Place" in Deep Navy / Slate 900 -->
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="44" fill="#0A1629" letter-spacing="-1.2">
      Place
    </text>
    
    <!-- "oni" in Electric Brand Blue -->
    <text x="122" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="44" fill="#0066FF" letter-spacing="-1.2">
      oni
    </text>
    
    <!-- "x" with Cyan leg and Emerald Green Growth Arrow -->
    <!-- Base stroke of x in cyan blue -->
    <path d="M198 -32L210 -15L196 4H208L216 -8L225 4H237L222 -15L231 -28H221L215 -20L208 -32H198Z" fill="url(#cyanLegGrad)"/>
    
    <!-- Upward arrow stroke on the x in bright emerald green -->
    <path d="M205 4L232 -32H242L211 4Z" fill="url(#greenArrowGrad)"/>
    <!-- Arrow head pointing top right -->
    <polygon points="228,-36 248,-36 248,-16 241,-21 234,-30" fill="url(#greenArrowGrad)"/>
    
    <!-- Emerald Green Dot on the 'i' -->
    <circle cx="182" cy="-35" r="4.2" fill="url(#greenArrowGrad)" />
  </g>

  <!-- === TAGLINE "CONNECT • MATCH • GROW" === -->
  <g transform="translate(110, 76)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="9.5" fill="#64748B" letter-spacing="3.8">
      CONNECT
    </text>
    <circle cx="82" cy="-3.5" r="2.2" fill="#0066FF"/>
    <text x="96" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="9.5" fill="#64748B" letter-spacing="3.8">
      MATCH
    </text>
    <circle cx="166" cy="-3.5" r="2.2" fill="#10B981"/>
    <text x="180" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="9.5" fill="#64748B" letter-spacing="3.8">
      GROW
    </text>
  </g>
</svg>